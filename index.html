<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dama">
<meta name="theme-color" content="#14281d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Dama</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#14281d;color:#f4f1e8;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
.hid{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#home{justify-content:center;gap:10px}
#home h1{font-size:54px;margin:0 0 14px;letter-spacing:2px}
#homebtns{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
#ver{margin-top:18px;font-size:12px;opacity:.5}
button{font:inherit;font-size:17px;padding:14px 12px;border:0;border-radius:12px;background:#2c4a39;color:#f4f1e8}
button:active{filter:brightness(1.3)}
button.pri{background:#c89b3c;color:#1a1308;font-weight:600}
#game{justify-content:space-between;padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}
.bar{width:var(--s);display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:2px 2px}
.bar span:last-child{opacity:.7;font-size:13px}
#status{width:var(--s);text-align:center;font-size:16px;font-weight:600;min-height:44px}
#status small{display:block;font-weight:400;font-size:12px;opacity:.7}
.hm{font-size:13px;font-weight:400;color:#ffd77a;margin-top:2px}
:root{--s:min(100vw - 16px,100dvh - 250px)}
#board{width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:3px solid #0b1710;border-radius:4px;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;background:var(--l)}
.sq.d{background:var(--d)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,235,59,.28)}
.sq.sel{box-shadow:inset 0 0 0 3px #ffeb3b}
.sq.must{animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:inset 0 0 0 3px rgba(255,80,60,.9)}}
.sq.tgt::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(255,235,59,.85)}
.sq.hint{box-shadow:inset 0 0 0 4px #4fc3f7}
.pc{width:82%;height:82%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)/16);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.pc.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d2c2 70%);border:2px solid #9a9380;color:#a07a14}
.pc.b{background:radial-gradient(circle at 35% 30%,#555,#161616 70%);border:2px solid #000;color:#e8b83a}
.pc.k{box-shadow:0 0 0 2px #e8b83a,0 2px 3px rgba(0,0,0,.5)}
#tools{display:flex;gap:6px;width:var(--s)}
#tools button{flex:1;font-size:14px;padding:10px 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#mbox{background:#1d3a2b;border-radius:16px;padding:18px;width:min(400px,100%);max-height:88dvh;overflow:auto;user-select:text;-webkit-user-select:text}
#mbox h2{margin:0 0 10px;font-size:22px}
.mb{font-size:15px;line-height:1.4}
.mb label{display:block;margin:12px 0 4px;font-size:13px;opacity:.7}
.mb label.ck{display:flex;gap:8px;align-items:center;opacity:1;font-size:15px}
.mb input[type=text],.mb input:not([type]),.mb input[type=password],.mb select{width:100%;font-size:17px;padding:10px;border-radius:10px;border:0;background:#f4f1e8;color:#111;user-select:text;-webkit-user-select:text}
.mb input[type=checkbox]{width:22px;height:22px}
.sm{font-size:12px;opacity:.65}
.seg{display:flex;gap:4px}.seg button{flex:1;font-size:14px;padding:10px 4px}.seg button.on{background:#c89b3c;color:#1a1308}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.code{font-size:44px;letter-spacing:8px;text-align:center;font-weight:700;color:#ffd77a;margin:8px 0}
.gd{font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="home" class="scr"><h1>Dama</h1><div id="homebtns"></div><div id="ver"></div></div>
<div id="game" class="scr hid">
  <div class="bar"><span id="oppname"></span><span id="oppinfo"></span></div>
  <div id="status"></div>
  <div id="board"></div>
  <div class="bar"><span id="myname"></span><span id="myinfo"></span></div>
  <div id="tools">
    <button id="t_hint">💡 Aiuto</button><button id="t_undo">↩ Annulla</button><button id="t_res">🏳 Abbandona</button><button id="t_menu">☰ Menu</button>
  </div>
</div>
<div id="modal" class="hid"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
